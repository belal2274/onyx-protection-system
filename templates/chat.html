<!DOCTYPE html>
<html dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX Secure Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="theme-style" rel="stylesheet" href="{{ url_for('static', filename='/src/CSS/chat.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/icon.ico') }}">
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-actions">
                <button class="chat-action-btn" title="Theme" id="themeToggleBtn"><i class="fas fa-moon"></i></button>
            </div>
            <h3 class="chat-title">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ONYX Logo">
                ONYX Secure Chat
            </h3>
            <div class="chat-actions">
                <button class="chat-action-btn" title="إغلاق" onclick="history.back()"><i
                        class="fas fa-times"></i></button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- الرسائل تظهر هنا -->
        </div>

        <div class="chat-input-container">
            <div class="attachment-btn" id="attachmentBtn">
                <i class="fas fa-paperclip"></i>
                <div class="attachment-menu" id="attachmentMenu">
                    <div class="attachment-menu-item" onclick="attachFile()">
                        <i class="far fa-file-alt"></i>
                        <span>مشاركة ملف</span>
                    </div>
                    <div class="attachment-menu-item" onclick="attachImage()">
                        <i class="far fa-image"></i>
                        <span>مشاركة صورة</span>
                    </div>
                </div>
                <input type="file" id="file-upload" style="display: none;">
            </div>
            <input type="text" class="chat-input" id="messageInput" placeholder="اكتب رسالة هنا..."
                onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="replyToMessage()">
            <i class="fas fa-reply"></i>
            <span>رد</span>
        </div>
        <div class="context-menu-item" onclick="showDeleteConfirmation()">
            <i class="fas fa-trash"></i>
            <span>حذف</span>
        </div>
        <div class="context-menu-item" onclick="copyMessage()">
            <i class="fas fa-copy"></i>
            <span>نسخ</span>
        </div>
    </div>
    <audio id="receiveSound" src="{{ url_for('static', filename='audio/receive.mp3') }}" preload="auto"></audio>
    <script src="{{ url_for('static', filename='src/js/chat.js') }}"></script>
</body>

</html>
